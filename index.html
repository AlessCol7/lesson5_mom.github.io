<style>
/* Layout: a film strip of chapters pinned on top; one chapter at a time.
   Each chapter opens on a poster-style title card (a sky that moves from dawn to night across the book),
   then a single reading column: scene, how it works, practice, cheat sheet, talk. */
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#17202A; --muted:#566370; --line:#D3D8D4;
  --accent:#1B6B75; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;

  --display:'Bodoni Moda','Didot','Bodoni 72','Times New Roman',serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1418; --card:#161E25; --ink:#E8EAE6; --muted:#98A3AD; --line:#2A343C;
    --accent:#5CC2CC; --accent-ink:#06191C; --accent-soft:#17333A;
    --irr:#DDA6E0; --irr-soft:#36213A;
    --ex:#E4C46E; --ex-soft:#3A2F14;
    --good:#6CCB92; --good-soft:#163A26; --bad:#F29088; --bad-soft:#42201D;
    --frame:#141D24; --frame-line:#33414B; --perf:#33414B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1418; --card:#161E25; --ink:#E8EAE6; --muted:#98A3AD; --line:#2A343C;
  --accent:#5CC2CC; --accent-ink:#06191C; --accent-soft:#17333A;
  --irr:#DDA6E0; --irr-soft:#36213A;
  --ex:#E4C46E; --ex-soft:#3A2F14;
  --good:#6CCB92; --good-soft:#163A26; --bad:#F29088; --bad-soft:#42201D;
  --frame:#141D24; --frame-line:#33414B; --perf:#33414B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}

p{margin:0 0 .8em}
a{color:var(--accent)}

button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Romanian help and teacher notes */
.ro{display:none;color:var(--muted);font-style:italic}
body.ro-on .ro{display:block}
body.ro-on span.ro.inl{display:inline}
body:not(.ro-on) .rocell{display:none}
.teacher{display:none}
body.teacher-on .teacher{display:block}

/* Film strip navigation */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--screen);color:var(--screen-fg)}
.strip::before,.strip::after{content:"";display:block;height:7px;background:repeating-linear-gradient(90deg,var(--perf) 0 9px,transparent 9px 18px)}
.strip-in{max-width:68rem;display:flex;gap:10px;align-items:center;padding-block:6px}
.frames{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-block:2px}
.frame{flex:none;min-width:42px;height:40px;padding:0 10px;border:1px solid var(--frame-line);background:var(--frame);color:#CBD3D8;border-radius:3px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.95rem;position:relative}

/* Title card */
.titlecard{position:relative;overflow:hidden;min-height:23rem;display:flex;align-items:flex-end;color:#fff;background:var(--screen)}

.titlecard .stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 12%,#fff,transparent),radial-gradient(1px 1px at 58% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 83% 14%,#fff,transparent),radial-gradient(1px 1px at 92% 38%,#fff,transparent),radial-gradient(1px 1px at 6% 44%,#fff,transparent),radial-gradient(1px 1px at 68% 8%,#fff,transparent)}
.titlecard .sun{position:absolute;left:var(--sx);top:var(--sy);width:58px;height:58px;border-radius:50%;background:var(--sunc);box-shadow:0 0 70px 12px var(--sunc);transform:translate(-50%,-50%)}
.titlecard .mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}

.titlecard .bar{position:absolute;left:0;right:0;height:5%;background:#000;z-index:2;animation:bars 1.4s cubic-bezier(.2,.7,.2,1) both}

.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:10px}

.mrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-start}

.bigidea{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}

.link-grid{display:grid;gap:10px}
.lk{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}

.beats{display:grid;gap:8px;counter-reset:b;padding:0;margin:0;list-style:none}
.beats li{counter-increment:b;display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:start}

.beats .ro{font-size:.95rem}

/* Cheat sheets */
.sheet{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:16px 16px 8px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

/* Exercises */
.exb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}

.gap,.long,select.sel{border:2px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 8px;min-width:0}
.gap{width:9rem}

/* ---------- Progress ---------- */
function exId(ch,ex,i){return ch.id+'-'+ex.id+'-'+i;}
function total(ch){var n=0;ch.ex.forEach(function(e){if(e.t!=='flip')n+=e.items.length;});return n;}
function doneCount(ch){var n=0;ch.ex.forEach(function(e){if(e.t==='flip')return;e.items.forEach(function(_,i){if(S.done[exId(ch,e,i)])n++;});});return n;}
function markDone(id){S.done[id]=1;save();refreshStrip();var c=$('#cnt');if(c){var ch=CH.filter(function(x){return x.id===cur;})[0];if(ch)c.textContent=doneCount(ch)+' of '+total(ch)+' done';}}

/* ---------- Renderers ---------- */
function titleCard(o){
  return '<header class="titlecard" style="--sky-a:'+o.sky[0]+';--sky-b:'+o.sky[1]+';--sx:'+o.sun[0]+';--sy:'+o.sun[1]+';--sunc:'+o.sun[2]+'">'+
  '<div class="sky"></div>'+(o.night?'<div class="stars"></div>':'')+'<div class="sun"></div>'+
  '<svg class="mtn" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true"><path class="m1" d="M0 200V110L140 60 260 120 380 50 520 130 660 70 800 140 940 60 1080 120 1200 80V200Z"/><path class="m2" d="M0 200V150L180 100 320 155 470 110 640 165 820 115 1000 160 1200 120V200Z"/></svg>'+
  '<div class="shade"></div><div class="bar t"></div><div class="bar b"></div>'+
  '<div class="wrap tc-in"><p class="kicker">'+o.kicker+'</p><h1>'+o.title+'</h1><p class="tag">'+o.tag+'</p><p class="tag ro">'+o.tagro+'</p><div class="chips">'+o.chips.map(function(c){return '<span class="chip-i">'+c+'</span>';}).join('')+'</div></div></header>';
}
function rFill(ch,ex){
  return '<div class="exb"><h3>'+ex.title+'</h3><p class="intro">'+ex.intro+'</p>'+ex.items.map(function(it,i){
    var id=exId(ch,ex,i),d=S.done[id];
    return '<div class="row'+(d?' good':'')+'" data-k="fill" data-id="'+id+'" data-ans="'+esc(it.ans.join('|'))+'" data-hint="'+esc(it.hint||'')+'"><span>'+it.pre+'</span><input id="in-'+id+'" class="gap" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer '+(i+1)+'"'+(d?' value="'+esc(it.ans[0])+'" disabled':'')+'><span class="base">('+it.base+')</span><span>'+it.post+'</span><span class="fb" aria-live="polite">'+(d?'Correct':'')+'</span></div>';
  }).join('')+'</div>';
}
function rSort(ch,ex){
  return '<div class="exb"><h3>'+ex.title+'</h3><p class="intro">'+ex.intro+'</p>'+ex.items.map(function(it,i){
    var id=exId(ch,ex,i),d=S.done[id];
    return '<div class="row sortrow'+(d?' good':'')+'" data-k="sort" data-id="'+id+'" data-a="'+it[1]+'"><span class="w">'+it[0]+'</span>'+
    (ex.id==='b'&&ch.id==='ch1'?sayBtn(it[0],'Listen'):'')+
    '<span class="bk">'+ex.buckets.map(function(b,bi){return '<button type="button" class="bkt'+(d&&bi===it[1]?' right':'')+'" data-b="'+bi+'"'+(d?' disabled':'')+'>'+b+'</button>';}).join('')+'</span><span class="fb" aria-live="polite">'+(d?'Correct':'')+'</span></div>';
  }).join('')+'</div>';
}
function rChoice(ch,ex){
  return '<div class="exb"><h3>'+ex.title+'</h3><p class="intro">'+ex.intro+'</p>'+ex.items.map(function(it,i){
    var id=exId(ch,ex,i),d=S.done[id];

  }).join('')+'</div>';
}
function rSelect(ch,ex){
  return '<div class="exb"><h3>'+ex.title+'</h3><p class="intro">'+ex.intro+'</p>'+ex.items.map(function(it,i){
    var id=exId(ch,ex,i),d=S.done[id];

function rBuild(ch,ex){
  return '<div class="exb"><h3>'+ex.title+'</h3><p class="intro">'+ex.intro+'</p>'+ex.items.map(function(w,i){
    var id=exId(ch,ex,i),d=S.done[id],ans=w.join(' ').replace(/ \?/g,'?');
    var sh=shuf(w,i+3);if(sh.join(' ')===w.join(' '))sh.reverse();
    return '<div class="bld'+(d?' good':'')+'" data-k="build" data-id="'+id+'" data-a="'+esc(ans)+'"><div class="line" aria-label="Your sentence">'+(d?w.map(function(x){return '<span class="chipw">'+x+'</span>';}).join(''):'')+'</div>'+
    '<div class="pool">'+(d?'':sh.map(function(x){return '<button type="button" class="chipw">'+x+'</button>';}).join(''))+'</div>'+

  }).join('')+'</div>';
}

function rOpen(ch,ex){

  return '<div class="talkbox"><h3 style="font-size:1.25rem;margin-bottom:.4rem">Draw a story card</h3><p>Pick a card, think for a moment, then tell the story.</p>'+
  '<div class="promptcard" id="pc" aria-live="polite"><h3>Press the button to draw a card.</h3></div><button type="button" class="btn primary" id="draw">Draw a card</button></div>'+
  '<div class="talkbox" style="margin-top:14px"><h3 style="font-size:1.25rem;margin-bottom:.6rem">Did I use…?</h3>'+CHECK.map(function(c,i){return '<label class="chk" for="ck'+i+'"><input type="checkbox" id="ck'+i+'" data-ck="'+i+'"'+(S.chk[i]?' checked':'')+'><span>'+c+'</span></label>';}).join('')+'</div>'+
  '<div class="talkbox teacher" style="margin-top:14px"><h3 style="font-size:1.25rem;margin-bottom:.4rem">Timer</h3><p class="timer" id="tmr">15:00</p><button type="button" class="btn primary" id="tgo">Start</button> <button type="button" class="btn" id="trs">Reset</button></div>';
}

function frameLinks(){
  var items=[['cover','Cover','Cover']].concat(CH.map(function(c,i){return [c.id,String(i+1),c.title];})).concat([['sheets','Sheets','Cheat sheets']]);
  $('#frames').innerHTML=items.map(function(it){
    var isN=/^\d$/.test(it[1]);
    return '<a class="frame" href="#'+it[0]+'" data-f="'+it[0]+'" title="'+esc(it[2])+'">'+(isN?'<b>'+it[1]+'</b><span class="fn">'+esc(it[2])+'</span>':'<span>'+it[1]+'</span>')+'</a>';
  }).join('');
}
function refreshStrip(){
  $$('.frame').forEach(function(f){
    var id=f.getAttribute('data-f');
    f.removeAttribute('aria-current');if(id===cur)f.setAttribute('aria-current','page');
    var ch=CH.filter(function(c){return c.id===id;})[0];
    f.classList.toggle('done',!!(ch&&total(ch)>0&&doneCount(ch)===total(ch)));
  });
}

function renderCover(){
  var tot=CH.reduce(function(a,c){return a+c.mins;},0);
  return titleCard({kicker:'English lesson 5',title:'The Long Weekend',tag:'Talk about the past the way people really do: in stories, with real phrases, questions and opinions.',tagro:'Vorbește despre trecut așa cum o fac oamenii în realitate: prin povești, cu expresii reale, întrebări și opinii.',sky:['#1B2A44','#D9A877'],sun:['72%','46%','#FFE2B0'],chips:['6 chapters',tot+' minutes','Past tense']})+
  '<div class="wrap body"><div class="part"><h2>The hour</h2><p>Chapters 1 to 5 are for doing: exercises, saying things aloud, short questions. Chapter 6 is the last fifteen minutes, and it is all talking. Chapters 1 to 5 each have three or four different kinds of exercise. Pick what fits the time and leave the rest as homework.</p>'+
  '<div class="bar-time" aria-hidden="true">'+CH.map(function(c){return '<i style="flex:'+c.mins+'"></i>';}).join('')+'</div>'+
  '<p class="ro">Capitolele 1–5 sunt pentru exerciții și vorbit. Capitolul 6 sunt ultimele cincisprezece minute, doar conversație.</p></div>'+
  '<div class="part"><h2>Chapters</h2><ul class="prog">'+CH.map(function(c,i){var t=total(c);return '<li><a href="#'+c.id+'"><span class="n">'+(i+1)+'</span><span><b>'+c.title+'</b><small>'+c.focus+'</small></span><span class="m">'+c.mins+' min'+(t?'<br>'+doneCount(c)+' of '+t:'')+'</span></a></li>';}).join('')+
  '<li><a href="#sheets"><span class="n">+</span><span><b>Cheat sheets</b><small>All six on one page</small></span><span class="m">keep</span></a></li></ul></div>'+
  '<div class="part"><h2>How to use this page</h2><ul class="talk"><li>Press <b>Listen</b> to hear English read aloud, then say it back.</li><li><b>RO</b> shows or hides the Romanian help.</li><li><b>Notes</b> shows the teacher notes and the timer.</li></ul></div>'+
  '<div class="chnav"><span></span><a class="nx" href="#ch1"><small>Begin</small><b>Chapter 1: '+CH[0].title+'</b></a></div></div>';
}
function renderSheets(){
  return titleCard({kicker:'Keep these',title:'Cheat sheets',tag:'One page for each chapter. Use them while you talk.',tagro:'O pagină pentru fiecare capitol. Folosește-le în timp ce vorbești.',sky:['#2E4A62','#B8D4D0'],sun:['62%','30%','#FFFBE0'],chips:['6 sheets']})+
  '<div class="wrap body">'+CH.map(function(c,i){return '<div class="part"><h2>Chapter '+(i+1)+': '+c.title+'</h2>'+sheet(c.sheet)+'</div>';}).join('')+'</div>';
}
function renderChapter(i){
  var ch=CH[i],prev=CH[i-1],next=CH[i+1];
  var h=titleCard({kicker:ch.n,title:ch.title,tag:ch.tag,tagro:ch.tagro,sky:ch.sky,sun:ch.sun,night:ch.night,chips:[ch.mins+' min',ch.focus]});
  h+='<div class="wrap body">';
  h+='<section class="part"><h2>The scene</h2><div class="legend">'+ch.legend.map(function(l){return '<span class="'+l[0]+'">'+l[1]+'</span>';}).join('')+'</div><div class="story'+(ch.drop?' drop':'')+'">'+
    ch.story.map(function(p){return '<div class="para"><p class="en">'+fmt(p.en)+'</p><p class="ro">'+p.ro+'</p>'+sayBtn(plain(p.en),'Listen')+'</div>';}).join('')+'</div></section>';
  h+='<section class="part"><h2>'+ch.howTitle+'</h2>'+ch.how()+'</section>';
  if(ch.stage){h+='<section class="part"><h2>Your story</h2>'+stageTool()+'</section>';}
  else{h+='<section class="part"><h2>Practice <span class="count" id="cnt">'+doneCount(ch)+' of '+total(ch)+' done</span></h2>'+ch.ex.map(function(e){return rEx(ch,e);}).join('')+'</section>';}
  h+='<section class="part"><h2>Cheat sheet</h2>'+sheet(ch.sheet)+'</section>';
  if(ch.talk.length){h+='<section class="part"><h2>Talk about it</h2><div class="talkbox"><ul class="talk">'+ch.talk.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div></section>';}
  h+='<aside class="notes teacher"><h3>Teacher notes</h3>'+ch.teacher+'</aside>';
  h+='<nav class="chnav" aria-label="Chapter navigation">'+(prev?'<a href="#'+prev.id+'"><small>Previous</small><b>'+prev.title+'</b></a>':'<a href="#cover"><small>Back to</small><b>The cover</b></a>')+
    (next?'<a class="nx" href="#'+next.id+'"><small>Next</small><b>'+next.title+'</b></a>':'<a class="nx" href="#sheets"><small>Finally</small><b>All cheat sheets</b></a>')+'</nav></div>';
  return h;
}

/* ---------- Routing ---------- */
var cur='cover',tmr=null;
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null;}}
function route(){
  stopTimer();
  var h=(location.hash||'').replace('#','');
  var idx=CH.map(function(c){return c.id;}).indexOf(h);
  cur=(idx>-1)?h:(h==='sheets'?'sheets':'cover');
  $('#stage').innerHTML=(cur==='cover')?renderCover():(cur==='sheets'?renderSheets():renderChapter(idx));
  refreshStrip();
  window.scrollTo(0,0);
  var f=$('.frame[data-f="'+cur+'"]');if(f&&f.scrollIntoView){try{f.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
}

/* ---------- Interaction ---------- */
function checkFill(inp){
  var row=inp.closest('.row'),val=inp.value.trim().toLowerCase();if(!val||row.dataset.last===val)return;row.dataset.last=val;
  var ans=row.dataset.ans.split('|'),fb=$('.fb',row);
  if(ans.indexOf(val)>-1){row.classList.remove('bad');row.classList.add('good');inp.disabled=true;fb.textContent='Correct';markDone(row.dataset.id);}
  else{var t=(+row.dataset.tries||0)+1;row.dataset.tries=t;row.classList.add('bad');fb.textContent=t>=2?('Answer: '+ans[0]):('Not yet. '+row.dataset.hint);}
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('gap'))checkFill(e.target);});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList.contains('gap'))checkFill(t);
  else if(t.classList.contains('sel')){
    var row=t.closest('.row'),fb=$('.fb',row);if(!t.value)return;
    if(t.value===row.dataset.a){row.classList.remove('bad');row.classList.add('good');t.disabled=true;fb.textContent='Correct';markDone(row.dataset.id);}
    else{row.classList.add('bad');fb.textContent='Not quite. Try another phrase.';}
  }else if(t.dataset&&t.dataset.ck!==undefined){S.chk[+t.dataset.ck]=t.checked;save();}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('say')){say(t.dataset.say);return;}
  if(t.classList.contains('flipc')){var on=t.classList.toggle('flipped');t.setAttribute('aria-pressed',on);if(on)say(t.dataset.say);return;}
  if(t.classList.contains('bkt')){
    var row=t.closest('.row'),fb=$('.fb',row);
    if(t.dataset.b===row.dataset.a){t.classList.add('right');row.classList.remove('bad');row.classList.add('good');$$('.bkt',row).forEach(function(b){b.disabled=true;});fb.textContent='Correct';markDone(row.dataset.id);}
    else{t.classList.add('wrong');t.disabled=true;row.classList.add('bad');fb.textContent='Try another one.';}
    return;
  }
  if(t.classList.contains('opt')){
    var q=t.closest('.q'),fb2=$('.fb',q);
    if(t.dataset.i===q.dataset.a){t.classList.add('right');q.classList.remove('bad');q.classList.add('good');$$('.opt',q).forEach(function(b){b.disabled=true;});fb2.textContent='Correct. '+q.dataset.why;markDone(q.dataset.id);}
    else{t.classList.add('wrong');t.disabled=true;q.classList.add('bad');fb2.textContent='Not quite. Try again.';}
    return;
  }
  if(t.classList.contains('chipw')){
    var bld=t.closest('.bld');if(!bld||bld.classList.contains('good'))return;
    var line=$('.line',bld),pool=$('.pool',bld);
    if(t.parentNode===pool)line.appendChild(t);else pool.appendChild(t);
    return;
  }
  if(t.dataset.act==='chk'){
    var b=t.closest('.bld'),words=$$('.line .chipw',b).map(function(x){return x.textContent;}).join(' ').replace(/ \?/g,'?'),fb3=$('.fb',b);
    if(words===b.dataset.a){b.classList.remove('bad');b.classList.add('good');$$('.chipw',b).forEach(function(c){c.disabled=true;});$('.bar2',b).querySelectorAll('.btn').forEach(function(x){x.remove();});fb3.textContent='Correct';markDone(b.dataset.id);say(b.dataset.a);}
    else{b.classList.add('bad');fb3.textContent='Not yet. Read it aloud and listen to it.';}
    return;
  }
  if(t.dataset.act==='clr'){var b2=t.closest('.bld');$$('.line .chipw',b2).forEach(function(c){$('.pool',b2).appendChild(c);});$('.fb',b2).textContent='';b2.classList.remove('bad');return;}
  if(t.dataset.act==='hear'){
    var r=t.closest('.row'),inp=$('.long',r),txt=inp.value.trim();if(!txt)return;
    say($('label',r).textContent+' '+txt);
    if(txt.split(/\s+/).length>=3){r.classList.add('good');$('.fb',r).textContent='Done';markDone(r.dataset.id);}
    return;
  }
  if(t.id==='draw'){
    var pr=PROMPTS[Math.floor(Math.random()*PROMPTS.length)],pc=$('#pc');
    if(pc&&pc.dataset.last===pr[0]){pr=PROMPTS[(PROMPTS.indexOf(pr)+1)%PROMPTS.length];}
    pc.dataset.last=pr[0];pc.innerHTML='<h3>'+pr[0]+'</h3><p class="ro">'+pr[1]+'</p>';return;
  }
  if(t.id==='tgo'){
    if(tmr){stopTimer();t.textContent='Start';return;}
    var el=$('#tmr'),left=(function(){var m=el.textContent.split(':');return (+m[0])*60+(+m[1]);})();
    t.textContent='Pause';
    tmr=setInterval(function(){left=Math.max(0,left-1);el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0){stopTimer();t.textContent='Start';}},1000);return;
  }
  if(t.id==='trs'){stopTimer();$('#tmr').textContent='15:00';$('#tgo').textContent='Start';return;}
});
function applyToggles(){
  document.body.classList.toggle('ro-on',S.ro);document.body.classList.toggle('teacher-on',S.teacher);
  $('#tro').setAttribute('aria-pressed',S.ro);$('#tte').setAttribute('aria-pressed',S.teacher);
}
$('#tro').addEventListener('click',function(){S.ro=!S.ro;save();applyToggles();});
$('#tte').addEventListener('click',function(){S.teacher=!S.teacher;save();applyToggles();});
$('#reset').addEventListener('click',function(){S.done={};S.chk=[];save();route();});
window.addEventListener('hashchange',route);
frameLinks();applyToggles();route();
})();
</script>

</body></html>
